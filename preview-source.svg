<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161a20"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232933"/>
      <stop offset="1" stop-color="#1c212a"/>
    </linearGradient>
  </defs>

  <!-- desktop background -->
  <rect width="1440" height="900" fill="url(#bg)"/>

  <!-- top bar mock (Omarchy bar) -->
  <rect x="0" y="0" width="1440" height="52" fill="#14181e"/>
  <rect x="0" y="51" width="1440" height="1" fill="#ffffff10"/>

  <!-- bar, left: generic pills -->
  <rect x="16" y="16" width="18" height="18" rx="5" fill="#bf616a" opacity="0.9"/>
  <circle cx="64" cy="25" r="3" fill="#ffffff2a"/>
  <circle cx="78" cy="25" r="3" fill="#ffffff2a"/>
  <circle cx="92" cy="25" r="3" fill="#ffffff2a"/>
  <rect x="116" y="14" width="70" height="22" rx="6" fill="#ffffff14"/>
  <rect x="196" y="14" width="46" height="22" rx="6" fill="#ffffff14"/>

  <!-- bar, right: generic status icons -->
  <rect x="1230" y="17" width="18" height="18" rx="4" fill="#ffffff22"/>
  <rect x="1262" y="17" width="18" height="18" rx="4" fill="#ffffff22"/>
  <rect x="1294" y="17" width="18" height="18" rx="4" fill="#ffffff22"/>
  <circle cx="1338" cy="26" r="9" fill="#ffffff22"/>
  <rect x="1360" y="18" width="16" height="16" rx="3" fill="#a3be8c" opacity="0.85"/>

  <!-- the LensGuard widget in the bar: red (active) camera glyph + dot -->
  <g transform="translate(1396,10) scale(1.3)">
    <g fill="none" stroke="#bf616a" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.2 12 v-1.2 a1.9 1.9 0 0 1 1.9-1.9 h3.8 a1.9 1.9 0 0 1 1.9 1.9 v1.2"/>
      <rect x="1" y="12" width="14" height="9.4" rx="2.2"/>
      <circle cx="8" cy="16.7" r="2.3"/>
      <circle cx="12.6" cy="14" r="0.8" fill="#bf616a" stroke="none"/>
    </g>
  </g>
  <circle cx="1418" cy="40" r="2.4" fill="#bf616a"/>

  <!-- panel mock (LensGuard popup) -->
  <g transform="translate(520,96)">
    <rect width="400" height="330" rx="14" fill="url(#card)" stroke="#ffffff12" stroke-width="1"/>
    <!-- header -->
    <g transform="translate(24,24)">
      <rect width="34" height="34" rx="8" fill="#14181e"/>
      <g transform="translate(11,11) scale(0.92)">
        <g fill="none" stroke="#d8dee9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8 v-0.8 a1.5 1.5 0 0 1 1.5-1.5 h3 a1.5 1.5 0 0 1 1.5 1.5 v0.8"/>
          <rect x="0.6" y="8" width="12" height="8.2" rx="1.9"/>
          <circle cx="6.6" cy="12.1" r="2"/>
        </g>
      </g>
      <text x="46" y="15" font-family="sans-serif" font-size="15" font-weight="700" fill="#e8ecf2">LensGuard</text>
      <text x="46" y="29" font-family="sans-serif" font-size="10.5" fill="#8b93a1">Camera activity guard</text>
      <rect x="300" y="6" width="76" height="20" rx="10" fill="#bf616a" opacity="0.16"/>
      <text x="338" y="19.5" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#e5969b" text-anchor="middle">CAMERA IN USE</text>
    </g>
    <line x1="24" y1="74" x2="376" y2="74" stroke="#ffffff10"/>
    <!-- body: status + holders -->
    <g transform="translate(24,92)">
      <text x="0" y="14" font-family="sans-serif" font-size="17" font-weight="700" fill="#e5969b">Camera in use</text>
      <text x="0" y="32" font-family="sans-serif" font-size="11" fill="#8b93a1">2 processes hold the camera open</text>

      <text x="0" y="66" font-family="sans-serif" font-size="10" font-weight="700" fill="#e8ecf2" letter-spacing="1">CAMERA HOLDERS</text>

      <!-- holder row 1 -->
      <rect x="0" y="80" width="352" height="54" rx="8" fill="#ffffff08"/>
      <circle cx="18" cy="107" r="4" fill="#bf616a"/>
      <text x="32" y="102" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#e8ecf2">ExampleCam 2.1</text>
      <text x="32" y="117" font-family="sans-serif" font-size="10" fill="#8b93a1">PID 4102</text>
      <text x="336" y="102" font-family="sans-serif" font-size="11.5" fill="#e8ecf2" text-anchor="end">/dev/video0</text>
      <text x="336" y="117" font-family="sans-serif" font-size="10" fill="#8b93a1" text-anchor="end">user demo</text>

      <!-- holder row 2 -->
      <rect x="0" y="142" width="352" height="54" rx="8" fill="#ffffff08"/>
      <circle cx="18" cy="169" r="4" fill="#bf616a"/>
      <text x="32" y="164" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#e8ecf2">videochat.example</text>
      <text x="32" y="179" font-family="sans-serif" font-size="10" fill="#8b93a1">PID 4237</text>
      <text x="336" y="164" font-family="sans-serif" font-size="11.5" fill="#e8ecf2" text-anchor="end">/dev/video0</text>
      <text x="336" y="179" font-family="sans-serif" font-size="10" fill="#8b93a1" text-anchor="end">user demo</text>

      <text x="0" y="222" font-family="sans-serif" font-size="9.5" fill="#6f7784">← ExampleCam 2.1 (PID 4102) opened the camera</text>
    </g>
  </g>

  <!-- caption bottom-left (dummy scene note, no real data) -->
  <text x="34" y="872" font-family="sans-serif" font-size="12" fill="#5c6470">LensGuard — dummy preview · fictional process names only</text>
  <text x="1406" y="872" font-family="sans-serif" font-size="12" fill="#5c6470" text-anchor="end">io.github.shirak-semonian.lensguard</text>
</svg>
