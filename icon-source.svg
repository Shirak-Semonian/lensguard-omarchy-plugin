<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- LensGuard camera glyph — line icon. Neutral (idle) state.
       The active and error PNGs are the same artwork with the stroke
       colour swapped (#bf616a / #ebcb8b). -->
  <g fill="none" stroke="#d8dee9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- top roof (viewfinder bump) -->
    <path d="M44 36 v-8 a10 10 0 0 1 10-10 h20 a10 10 0 0 1 10 10 v8"/>
    <!-- body -->
    <rect x="16" y="34" width="96" height="60" rx="12"/>
    <!-- lens -->
    <circle cx="64" cy="64" r="14"/>
    <!-- record dot -->
    <circle cx="97" cy="52" r="3.5" fill="#d8dee9" stroke="none"/>
  </g>
</svg>
